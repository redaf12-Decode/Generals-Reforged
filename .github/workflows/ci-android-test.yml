# Android ARM64 platform foundation and runtime-integration check (Phase 1, Phase 2, Phase 3, Phase 4).
#
# This is a dedicated workflow, not part of linux-release.yml, because it validates a different
# question: does the project configure and compile for Android arm64-v8a at all. It does not package
# an APK and it does not run the desktop test suite.
#
# What it proves, in order:
#   1. the Android SDK/NDK environment is set up from pinned, checksummed Google archives;
#   2. scripts/build/android/build-android.sh and the tools it needs are present and valid;
#   3. Android is detected as its own platform and is never classified as Linux, and arm64-v8a is
#      identified as AArch64 - both checked by the committed `cmake -P` matrices, which run here
#      even though the host is x86-64;
#   4. the ARM64 configure succeeds with CMAKE_SYSTEM_NAME=Android, the AArch64 NDK Clang,
#      ABI arm64-v8a, API 28 and c++_shared, and no desktop-Linux library reaches the link graph;
#   5. the platform layer and a bounded set of targets compile quickly, as a fast signal;
#   6. the SDL3 Vulkan GPU backend is compiled for Android (Phase 3): the generated build config has
#      SDL_GPU_VULKAN, and the SDL3-GPU renderer and its device-feature/depth-format code are in the
#      graph - so the graphics path this phase changes is reachable and aarch64-clean;
#   7. the native touch layer compiles for Android (Phase 4): SdlTouch.cpp's ZH_ANDROID half is
#      compiled into sdlinput and the object is checked to define SdlTouch_dispatch/update and to
#      reference SDL_SetHint (called only by that half), so the desktop stub is not what was built;
#   8. the whole engine links as libmain.so for arm64-v8a (Phase 2): the `generals` target builds
#      PosixMain.cpp as the shared library SDL3's SDLActivity loads, exercising every dependency in
#      the link graph (GameSpy, FFmpeg, FreeType, mbedTLS, SDL3 GPU). The result is asserted to be
#      an AArch64 shared object exporting SDL_main and linking Android system libraries only. A
#      successful configure is not treated as proof of compilation.
#
# Dependencies that are not Android-ready are reported, not hidden and not worked around by
# disabling them: see docs/android-port/audit/05-dependency-compatibility.md. The Phase-3 graphics
# changes are described in docs/android-port/architecture/13-android-vulkan-rendering.md.

name: CI Android Test

on:
  workflow_dispatch:
  push:
    branches:
      - android-arm64-port
  pull_request:
    paths:
      - 'GeneralsMD/Code/CMakeLists.txt'
      - 'GeneralsMD/Code/cmake/**'
      - 'GeneralsMD/Code/Tests/**'
      - 'GeneralsMD/Code/Main/**'
      - 'GeneralsMD/Code/GameEngineDevice/**'
      - 'GeneralsMD/Code/GameEngine/**'
      - 'GeneralsMD/Code/Libraries/**'
      - 'scripts/build/android/**'
      - '.github/workflows/ci-android-test.yml'

permissions:
  contents: read

concurrency:
  group: ci-android-test-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # Pinned so a cross-compile that works today does not pick up a different toolchain tomorrow.
  # The cmdline-tools sha1 and the NDK are Google's own repository2-3.xml values.
  CMDLINE_TOOLS_VERSION: '13114758'
  CMDLINE_TOOLS_SHA1: '5fdcc763663eefb86a5b8879697aa6088b041e70'
  NDK_VERSION: '27.2.12479018'
  ANDROID_API: '28'
  # Under the runner user's home, so actions/cache can write it without root (a path under /opt
  # would need sudo for the cache restore, not just the install).
  ANDROID_SDK_ROOT: /home/runner/android-sdk
  ANDROID_HOME: /home/runner/android-sdk

jobs:
  android-arm64:
    name: Android ARM64 foundation (configure and compile)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out the branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare the ephemeral runner
        run: |
          # Only on this disposable hosted runner. The preinstalled Android SDK is removed so the
          # pinned one below is the only SDK in play, and ~10 GiB is freed for the NDK and the build.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build git curl unzip xz-utils python3 ca-certificates
          # sdkmanager is a Java tool; the hosted image ships a JDK, but do not assume it.
          if ! command -v java >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends openjdk-17-jre-headless
          fi
          sudo apt-get clean
          cmake --version
          ninja --version
          java -version
          df -h "$RUNNER_TEMP"

      - name: Restore the Android SDK and NDK cache
        id: sdk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}
          key: android-sdk-cmdline${{ env.CMDLINE_TOOLS_VERSION }}-ndk${{ env.NDK_VERSION }}-p${{ env.ANDROID_API }}

      - name: Install the Android SDK, NDK and platform
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # --retry-all-errors and --http1.1: the 157 MiB cmdline-tools download has been seen to fail
          # at 90%+ with "HTTP/2 stream was not closed cleanly" (curl 92), which plain --retry does not
          # cover. The SDK is cached once it succeeds, so this is the one download that must be robust.
          curl -fL --http1.1 --retry 5 --retry-all-errors --retry-delay 5 -o /tmp/cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS_VERSION}_latest.zip"
          echo "${CMDLINE_TOOLS_SHA1}  /tmp/cmdline-tools.zip" | sha1sum -c -
          mkdir -p "${ANDROID_SDK_ROOT}/cmdline-tools"
          unzip -q /tmp/cmdline-tools.zip -d "${ANDROID_SDK_ROOT}/cmdline-tools"
          # sdkmanager requires the <sdk>/cmdline-tools/latest layout to locate the SDK root.
          mv "${ANDROID_SDK_ROOT}/cmdline-tools/cmdline-tools" "${ANDROID_SDK_ROOT}/cmdline-tools/latest"
          rm /tmp/cmdline-tools.zip
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "ndk;${NDK_VERSION}" "platforms;android-${ANDROID_API}"

      - name: Export the Android environment
        run: |
          set -euo pipefail
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          test -f "${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}/build/cmake/android.toolchain.cmake" \
            || { echo "::error::the NDK toolchain file is missing after install"; exit 1; }
          test -d "${ANDROID_SDK_ROOT}/platforms/android-${ANDROID_API}" \
            || { echo "::error::platform android-${ANDROID_API} is missing after install"; exit 1; }

      - name: Validate the Android build scripts
        run: |
          set -euo pipefail
          bash -n scripts/build/android/build-android.sh
          scripts/build/android/build-android.sh --help >/dev/null
          echo "build-android.sh is syntactically valid and answers --help"

      - name: Cache the vendored dependency downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/zhr-vendor
          key: android-vendor-v1-${{ hashFiles('GeneralsMD/Code/Tools/vendor.sh', 'GeneralsMD/Code/Libraries/Source/**/*.patch') }}

      - name: Fetch the code dependencies
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          bash GeneralsMD/Code/Tools/vendor.sh --no-art
          for dep in SDL3/CMakeLists.txt miniaudio/miniaudio.c mbedtls/library/ssl_tls.c \
                     glslang freetype SPIRV-Cross SDL_shadercross GameSpy; do
            test -e "GeneralsMD/Code/Libraries/Source/${dep}" \
              || { echo "::error::vendor.sh did not produce Libraries/Source/${dep}"; exit 1; }
          done

      - name: Platform and architecture detection matrices
        run: |
          set -euo pipefail
          # Both run on this x86-64 host and exercise the Android rows, because the detection
          # functions take their inputs as arguments (no compiler, no toolchain needed).
          cmake -P GeneralsMD/Code/Tests/test_platform_detection.cmake
          cmake -P GeneralsMD/Code/Tests/test_architecture_detection.cmake

      - name: Android is its own platform and arm64-v8a is AArch64
        run: |
          set -euo pipefail
          # A small explicit assertion over the two detection functions, in addition to the committed
          # matrices above, so the CI log says in words what the Android contract is. The cmake
          # directory is passed as ZH_CMAKE_DIR: CMAKE_CURRENT_LIST_DIR is the directory of this
          # generated script, not of the file it includes. The heredoc body is indented with the
          # script; CMake ignores leading whitespace.
          cat > "$RUNNER_TEMP/assert-android.cmake" <<'EOF'
          include(${ZH_CMAKE_DIR}/DetectPlatform.cmake)
          include(${ZH_CMAKE_DIR}/DetectArchitecture.cmake)
          zh_detect_platform("Android" "1" W P M L A)
          if(NOT A)
            message(FATAL_ERROR "Android was not detected as its own platform")
          endif()
          if(L)
            message(FATAL_ERROR "Android was classified as Linux - this must never happen")
          endif()
          if(NOT P)
            message(FATAL_ERROR "Android lost the POSIX umbrella it shares with macOS and Linux")
          endif()
          if(W OR M)
            message(FATAL_ERROR "Android was detected as Windows or macOS")
          endif()
          zh_detect_architecture("aarch64" "" "" X64 A64 KNOWN)
          if(NOT A64 OR X64)
            message(FATAL_ERROR "aarch64 was not identified as AArch64 (or was identified as x86-64)")
          endif()
          zh_detect_architecture("" "" "arm64-v8a" X64B A64B KNOWNB)
          if(NOT A64B OR X64B)
            message(FATAL_ERROR "the arm64-v8a ABI was not identified as AArch64")
          endif()
          message(STATUS "Android is its own platform (never Linux); aarch64 and arm64-v8a are AArch64")
          EOF
          cmake -DZH_CMAKE_DIR="$PWD/GeneralsMD/Code/cmake" -P "$RUNNER_TEMP/assert-android.cmake"

      - name: Configure the ARM64 build
        run: |
          set -euo pipefail
          scripts/build/android/build-android.sh --no-build --config Release \
            --build-dir "$RUNNER_TEMP/build-android-arm64"

      - name: Assert the toolchain, ABI, API and STL
        env:
          BUILD: ${{ runner.temp }}/build-android-arm64
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          system=$(ls "$BUILD"/CMakeFiles/*/CMakeSystem.cmake)
          compiler=$(ls "$BUILD"/CMakeFiles/*/CMakeCXXCompiler.cmake)

          echo "--- CMakeSystem.cmake ---"; grep -E 'CMAKE_SYSTEM_(NAME|PROCESSOR)' "$system"
          echo "--- Android cache entries ---"; grep -E '^ANDROID_(ABI|PLATFORM|STL|NDK_HOME)' "$BUILD/CMakeCache.txt"

          # Android is its own system and is AArch64 - never the host's x86-64.
          grep -qE 'set\(CMAKE_SYSTEM_NAME +"?Android"?\)' "$system" \
            || fail "CMAKE_SYSTEM_NAME is not Android in $system"
          grep -qE 'set\(CMAKE_SYSTEM_PROCESSOR +"?(aarch64|arm64)"?\)' "$system" \
            || fail "CMAKE_SYSTEM_PROCESSOR is not aarch64 in $system"
          if grep -qE 'set\(CMAKE_SYSTEM_PROCESSOR +"?(x86_64|amd64|x64)"?\)' "$system"; then
            fail "CMAKE_SYSTEM_PROCESSOR is a host x86-64 value: Android arm64 must not be classified as x86-64"
          fi

          # CMake's own view of the compiler's target architecture, and the sysroot triple it resolved.
          grep -q 'set(CMAKE_CXX_COMPILER_ARCHITECTURE_ID "aarch64")' "$compiler" \
            || fail "the C++ compiler architecture id is not aarch64 in $compiler"
          grep -q 'set(CMAKE_CXX_LIBRARY_ARCHITECTURE "aarch64-linux-android")' "$compiler" \
            || fail "the C++ library architecture is not aarch64-linux-android in $compiler"

          grep -qE '^ANDROID_ABI:[^=]*=arm64-v8a$'       "$BUILD/CMakeCache.txt" || fail "ANDROID_ABI is not arm64-v8a"
          grep -qE '^ANDROID_PLATFORM:[^=]*=android-28$' "$BUILD/CMakeCache.txt" || fail "ANDROID_PLATFORM is not android-28"
          grep -qE '^ANDROID_STL:[^=]*=c\+\+_shared$'    "$BUILD/CMakeCache.txt" || fail "ANDROID_STL is not c++_shared"

          # The definitive proof, independent of how any generator spells its command lines: ask the
          # NDK's own arm64 compiler what it targets, then compile a translation unit with it and read
          # the machine back out of the object. The wrapper's name and its -dumpmachine both carry the
          # aarch64-linux-android triple, and the object's ELF header must say AArch64.
          cxx=$(sed -n 's/^set(CMAKE_CXX_COMPILER "\(.*\)")$/\1/p' "$compiler" | head -n 1)
          [ -n "$cxx" ] || fail "CMakeCXXCompiler.cmake has no CMAKE_CXX_COMPILER"
          prebuilt=$(dirname "$cxx")
          wrapper="$prebuilt/aarch64-linux-android${ANDROID_API}-clang++"
          readelf_tool="$prebuilt/llvm-readelf"
          [ -x "$wrapper" ] || fail "the NDK arm64 compiler wrapper is missing: $wrapper"
          [ -x "$readelf_tool" ] || fail "the NDK llvm-readelf is missing: $readelf_tool"

          triple=$("$wrapper" -dumpmachine)
          echo "compiler target triple: $triple"
          # The NDK's Clang reports the triple as "aarch64-unknown-linux-android28" (an optional vendor
          # field and the API level appended), so match the two facts that matter rather than one
          # exact spelling: the target is aarch64, and it is Android.
          case "$triple" in
            aarch64*) ;;
            *) fail "the compiler targets '$triple', which is not an aarch64 target" ;;
          esac
          case "$triple" in
            *android*) ;;
            *) fail "the compiler targets '$triple', which is not an Android target" ;;
          esac

          printf 'int zh_arch_probe(void) { return 0; }\n' > "$RUNNER_TEMP/arch-probe.cpp"
          "$wrapper" -c "$RUNNER_TEMP/arch-probe.cpp" -o "$RUNNER_TEMP/arch-probe.o"
          "$readelf_tool" -h "$RUNNER_TEMP/arch-probe.o" | grep -E 'Class:|Machine:'
          "$readelf_tool" -h "$RUNNER_TEMP/arch-probe.o" | grep -q 'AArch64' \
            || fail "the object compiled by the NDK compiler is not AArch64"

          echo "system: Android; processor: aarch64; compiler: aarch64-linux-android; abi: arm64-v8a; api: 28; stl: c++_shared"

      - name: Assert the desktop-Linux dependencies are absent and Android's are present
        env:
          BUILD: ${{ runner.temp }}/build-android-arm64
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          # Negative: none of the desktop-Linux or Windows-only link inputs may reach an Android
          # build. These are exactly the things gated on ZH_PLATFORM_LINUX / ZH_PLATFORM_WINDOWS,
          # which Android never sets (checked above), so their presence would mean the platform
          # split leaked. Link-library names are used, not bare words, so a first-party target whose
          # name merely contains a substring (posixd3d9, say) cannot cause a false failure. Both Ninja
          # files are scanned: build.ninja holds the build statements, rules.ninja the command lines
          # with the -l flags.
          for token in '-lfontconfig' '-lX11' '-lxkbcommon' '-lwayland-client' 'steamnetworkingsockets'; do
            if grep -q -- "$token" "$BUILD/build.ninja" "$BUILD/CMakeFiles/rules.ninja"; then
              fail "a desktop-only dependency ($token) reached the Android link graph"
            fi
          done
          echo "absent from the Android link graph: fontconfig, X11, xkbcommon, Wayland, GameNetworkingSockets"

          # Positive: the platform layer and the dependency-light libraries SDL3 needs are configured.
          # Target names appear in build.ninja's build statements.
          for token in SDL3 miniaudio mbedtls; do
            grep -qi -- "$token" "$BUILD/build.ninja" || fail "$token is not in the Android build graph"
          done
          echo "present in the Android build graph: SDL3, miniaudio, mbedTLS"

      - name: Report the dependency compatibility result
        run: |
          set -euo pipefail
          {
            echo "### Android dependency compatibility (Phase 1, Phase 2)"
            echo ""
            echo "Class 1 (ready) and Class 2 (Android config only) are configured and, where listed,"
            echo "compiled below. The Class 3 items are built by the libmain.so link in Phase 2."
            echo ""
            echo "| Item | Class | Result |"
            echo "|:--|:--|:--|"
            echo "| SDL3 / SDL3 GPU | 1 | configured, compiled |"
            echo "| miniaudio | 1 | configured, compiled |"
            echo "| mbedTLS | 1 | configured, compiled |"
            echo "| FreeType | 1 | configured, compiled |"
            echo "| Vulkan | 2 | from the NDK sysroot |"
            echo "| glslang / SPIRV-Cross / SDL_shadercross | 2 | configured, compiled |"
            echo "| GameSpy (pthread_cancel patched) | 3 | built and linked into libmain.so |"
            echo "| FFmpeg 8.1.2 (cross-built for aarch64) | 3 | built and linked into libmain.so |"
            echo "| Bink (FFmpeg-backed) | 3 | compiled into libmain.so |"
            echo "| fontconfig (font substitute) | 4 | gated out, no link |"
            echo "| Miles (miniaudio-backed) | 2 | compiled into libmain.so |"
            echo "| X11 / Wayland / DirectX / DXVK / CURL+GNS | 5 | not required |"
            echo ""
            echo "See docs/android-port/audit/05-dependency-compatibility.md for the evidence."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compile a bounded set of targets under the NDK
        env:
          BUILD: ${{ runner.temp }}/build-android-arm64
        run: |
          set -euo pipefail
          # SDL3 is the platform layer; miniaudio and mbedTLS are Class 1; the predicate tests are
          # first-party and dependency-light. The two GPU self-checks are dependency-light too (one
          # links only SDL3's headers, one links nothing but its own translation unit), so they compile
          # here as a fast signal that the Phase-3 device-feature and depth-format code is
          # aarch64-clean. A fast signal before the full engine link below.
          cmake --build "$BUILD" --parallel "$(nproc)" --target \
            SDL3-static miniaudio mbedtls sdlinput test_platform_predicates test_msvc_float_casts \
            test_sdl_gpu_device_features sdl_gpu_depth_format_selfcheck
          echo "compiled for aarch64-linux-android: SDL3, miniaudio, mbedTLS, the SDL input/touch layer, the predicate tests, the GPU device-feature and depth-format self-checks"

      - name: Assert the SDL3 Vulkan GPU backend is compiled for Android
        env:
          BUILD: ${{ runner.temp }}/build-android-arm64
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          # SDL3 has exactly three GPU backends (Metal, D3D12, Vulkan) and no GLES one, and on Android
          # only Vulkan is enabled (SDL_build_config_android.h). The generated build config is the
          # proof: SDL3's own CMakeLists file(GENERATE)s it from the platform config, so this is the
          # header SDL3 actually compiles against for this ABI, not the committed source.
          config=$(find "$BUILD" -path '*/build_config/SDL_build_config.h' | head -n 1)
          [ -n "$config" ] || fail "SDL3's generated build_config/SDL_build_config.h was not found under $BUILD"
          echo "--- $config ---"
          grep -E 'SDL_GPU_VULKAN|SDL_VIDEO_VULKAN' "$config" || true
          grep -qE '^#define SDL_GPU_VULKAN 1' "$config" \
            || fail "SDL_GPU_VULKAN is not enabled in the Android SDL3 build config: the game has no GPU backend on Android"

          # The engine's renderer is the SDL3-GPU one (posixd3d9), and it must be in the Android graph:
          # if it were gated out, libmain.so would link without a renderer and the Vulkan work would be
          # unreachable. The device-feature fallback and the depth-format self-check are its own code.
          for token in posixd3d9 SdlGpuDeviceFeatures SdlGpuFrame; do
            grep -qi -- "$token" "$BUILD/build.ninja" || fail "$token is not in the Android build graph"
          done
          echo "SDL_GPU_VULKAN is on for Android; the SDL3-GPU renderer and its Phase-3 code are in the graph"

      - name: Assert the native touch layer compiled for Android (Phase 4)
        env:
          BUILD: ${{ runner.temp }}/build-android-arm64
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          obj=$(find "$BUILD" -path '*sdlinput*' -name 'SdlTouch.cpp.o' | head -n 1)
          [ -n "$obj" ] || fail "SdlTouch.cpp was not compiled into sdlinput for Android"

          compiler=$(ls "$BUILD"/CMakeFiles/*/CMakeCXXCompiler.cmake)
          cxx=$(sed -n 's/^set(CMAKE_CXX_COMPILER "\(.*\)")$/\1/p' "$compiler" | head -n 1)
          [ -n "$cxx" ] || fail "CMakeCXXCompiler.cmake has no CMAKE_CXX_COMPILER"
          prebuilt=$(dirname "$cxx")
          nm_tool="$prebuilt/llvm-nm"
          readelf_tool="$prebuilt/llvm-readelf"
          [ -x "$nm_tool" ] || fail "the NDK llvm-nm is missing: $nm_tool"

          header=$("$readelf_tool" -h "$obj")
          grep -q 'Machine: *AArch64' <<<"$header" || fail "the touch object is not AArch64"

          # --demangle: these entry points are C++ (the SdlInput layer's convention), so the raw
          # names are mangled; SDL_SetHint is extern "C" and is not.
          syms=$("$nm_tool" --demangle "$obj")
          # Defined: the entry points SdlInput_dispatch and the per-frame pump call.
          for s in SdlTouch_install SdlTouch_dispatch SdlTouch_update SdlTouch_reset; do
            grep -qE "[[:space:]]T $s\\(" <<<"$syms" || fail "$s is not defined in the Android SdlTouch object"
          done
          # Undefined: SDL_SetHint is called only by the ZH_ANDROID half (SdlTouch_install). Its
          # presence proves that half was compiled, not the desktop stub.
          grep -qE "[[:space:]]U SDL_SetHint$" <<<"$syms" \
            || fail "SdlTouch.cpp.o does not reference SDL_SetHint: the Android half was not compiled"

          echo "native touch layer compiled for aarch64-linux-android: SdlTouch_dispatch et al. defined, SDL_SetHint referenced"

      - name: Build the engine as libmain.so for arm64-v8a
        env:
          BUILD: ${{ runner.temp }}/build-android-arm64
        run: |
          set -euo pipefail
          # The `generals` target is PosixMain.cpp built as the shared library SDL3's SDLActivity
          # loads (add_library(main SHARED), OUTPUT_NAME main). Linking it exercises the whole engine
          # and every dependency in the graph - GameSpy, FFmpeg (cross-built for aarch64 here),
          # FreeType, mbedTLS, SDL3 GPU, the SdlDevice/W3DDevice layers - so a link failure names a
          # real Phase-2 problem rather than being hidden behind a configure that passed.
          cmake --build "$BUILD" --parallel "$(nproc)" --target generals
          echo "linked the engine for aarch64-linux-android: $BUILD/libmain.so"

      - name: Assert libmain.so is an AArch64 shared object exporting SDL_main
        env:
          BUILD: ${{ runner.temp }}/build-android-arm64
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          [ -f "$BUILD/libmain.so" ] || fail "the engine did not produce libmain.so"

          # The NDK's own readelf, found through the compiler CMake recorded.
          compiler=$(ls "$BUILD"/CMakeFiles/*/CMakeCXXCompiler.cmake)
          cxx=$(sed -n 's/^set(CMAKE_CXX_COMPILER "\(.*\)")$/\1/p' "$compiler" | head -n 1)
          [ -n "$cxx" ] || fail "CMakeCXXCompiler.cmake has no CMAKE_CXX_COMPILER"
          readelf_tool="$(dirname "$cxx")/llvm-readelf"
          [ -x "$readelf_tool" ] || fail "the NDK llvm-readelf is missing: $readelf_tool"

          # readelf's output is captured first, and grepped from a variable rather than piped: under
          # `set -o pipefail` a `readelf ... | grep -q` on the multi-megabyte symbol table fails with
          # SIGPIPE (grep exits at the first match while readelf is still writing), which reports a
          # symbol that IS present as missing.
          header=$("$readelf_tool" -h "$BUILD/libmain.so")
          echo "--- libmain.so ELF header ---"
          grep -E 'Class:|Machine:|Type:' <<<"$header"
          grep -q 'Machine: *AArch64' <<<"$header" || fail "libmain.so is not an AArch64 object"
          grep -qE 'Type: *DYN' <<<"$header" || fail "libmain.so is not a shared object (DYN)"

          # SDL3's SDLActivity dlsym()s SDL_main from libmain.so: the entry point must be exported.
          dynsyms=$("$readelf_tool" --dyn-syms "$BUILD/libmain.so")
          grep -qE '[[:space:]]SDL_main$' <<<"$dynsyms" \
            || fail "libmain.so does not export SDL_main (SDLActivity cannot start the game)"

          needed=$("$readelf_tool" -d "$BUILD/libmain.so")
          echo "--- libmain.so NEEDED ---"
          grep -E 'NEEDED|SONAME' <<<"$needed"
          grep -q 'libc++_shared.so' <<<"$needed" \
            || fail "libmain.so does not link the Android shared C++ runtime (c++_shared)"
          # No desktop-Linux library may have reached the shared object's dependencies.
          for token in libX11 libfontconfig libwayland libxkbcommon libGL.so; do
            if grep -q -- "$token" <<<"$needed"; then
              fail "a desktop-only library ($token) reached libmain.so's NEEDED list"
            fi
          done

          echo "libmain.so: AArch64 shared object, exports SDL_main, links Android system libraries only"

      - name: Upload the configure and build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-arm64-diagnostics
          path: |
            ${{ runner.temp }}/build-android-arm64/android-configure.log
            ${{ runner.temp }}/build-android-arm64/android-build.log
            ${{ runner.temp }}/build-android-arm64/CMakeFiles/*/CMakeSystem.cmake
            ${{ runner.temp }}/build-android-arm64/CMakeFiles/*/CMakeCXXCompiler.cmake
          if-no-files-found: warn
          retention-days: 7
