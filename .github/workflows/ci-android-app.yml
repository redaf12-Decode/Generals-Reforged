# Android application shell (Phase 2), game-folder access (Phase 3) and native dependency
# packaging (Phase 4) of the Android port.
#
# A dedicated workflow, separate from ci-android-test.yml, because it answers a different
# question: does the Gradle application project build and package a correct, shippable APK around
# the engine libmain.so. ci-android-test.yml proves the native half (configure, compile, link
# libmain.so for arm64-v8a); this one builds that same engine, classifies its runtime
# dependencies, packages them and inspects the actual APK.
#
# It does not install or launch on a device - there is no device here - so it never claims
# either. What it proves, in order:
#   1. the Android SDK, build-tools, platform 35 and the NDK are set up from pinned Google
#      archives, and Gradle 8.12 (SDL3 3.4.16's own wrapper version) is on PATH;
#   2. the engine links as libmain.so for arm64-v8a from the real sources (build-android.sh):
#      a real runtime dependency set, not a stand-in, is what gets packaged;
#   3. the native dependencies are classified from the ELF itself (Phase 4): Class/Machine/Type,
#      SONAME, the DT_NEEDED set, the exported SDL_main, the dynamic symbols the loader must
#      resolve, and the Android API the object was built for - no desktop library may appear;
#      and libSDL3.so, the standalone SDL3 the engine links against, is checked as an object in its
#      own right (AArch64, SONAME libSDL3.so, exports JNI_OnLoad and SDL_*);
#   4. the application project's Gradle configuration is valid and the packaged manifest is the
#      merged one AGP produces: the setup (folder-picker) Activity and the game Activity, the
#      landscape orientation, the configChanges set, the single justified multicast permission
#      and the absence of storage permissions;
#   5. the game-folder logic is unit-tested on the host: the engine's own install-folder rule
#      (INIZH.big plus the base game's Textures.big) and the incremental staging plan (copy
#      once, then only what changed) - see GameFolderValidatorTest, GameDataStagingTest;
#   6. the packaging script and the static verifier are syntactically valid, and the packaging script
#      finds the libraries it stages;
#   7. an APK is actually assembled and its contents inspected - libmain.so, libSDL3.so and
#      libc++_shared.so under lib/arm64-v8a, no other ABI, exactly one SDL3 shared object, every
#      non-system DT_NEEDED of libmain.so present in the APK, no proprietary game data,
#      SetupActivity as the home-screen entry point, and no storage permission;
#   8. the static verifier (scripts/build/android/verify-android-native-libs.sh) re-audits both the
#      staged payload and the APK's: ELF class/machine, SONAME, DT_NEEDED resolution, the required
#      exports and JNI entry points, one SDL3, and that the packaged objects are the staged ones.
#
# Reuse: the engine is built here rather than downloaded because no compatible native output
# exists to reuse - ci-android-test.yml publishes only logs (no libmain.so artifact) and does not
# trigger on this branch. Rebuilding it is therefore the only way to package the real engine, and
# it happens here, in GitHub Actions, never locally. The dependency classification (step 3) is
# the reference port's "every non-system DT_NEEDED must be a real file inside the APK" check:
# this port links SDL3 as a standalone shared library (libSDL3.so) and the NDK's C++ runtime
# (libc++_shared.so), so those two are the packaged dependencies.

name: CI Android App

on:
  workflow_dispatch:
  push:
    branches:
      - agent/android-arm64-application-port
      - agent/android-sdl3-android-completion
  pull_request:
    paths:
      - 'android/**'
      - 'scripts/build/android/package-android.sh'
      - '.github/workflows/ci-android-app.yml'

permissions:
  contents: read

concurrency:
  group: ci-android-app-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CMDLINE_TOOLS_VERSION: '13114758'
  CMDLINE_TOOLS_SHA1: '5fdcc763663eefb86a5b8879697aa6088b041e70'
  NDK_VERSION: '27.2.12479018'
  GRADLE_VERSION: '8.12'
  # The app packages against 35 (compileSdk/targetSdk); the native engine is built against 28 (the
  # port's floor - build-android.sh --api). Both platforms are installed.
  ANDROID_API: '35'
  NATIVE_API: '28'
  # The native build's ABI and configuration, named once here and used in the ccache key so an
  # incompatible cache cannot be restored.
  NATIVE_ABI: 'arm64-v8a'
  NATIVE_BUILD_TYPE: 'Release'
  ANDROID_SDK_ROOT: /home/runner/android-sdk
  ANDROID_HOME: /home/runner/android-sdk
  # The native engine's build tree, shared by the native build and the packaging step.
  NATIVE_BUILD: ${{ github.workspace }}/build-android-arm64
  # ccache: a persistent compiler cache for the native half, restored and saved by the cache step
  # below and picked up by scripts/build/android/build-android.sh (it is handed to CMake as
  # CMAKE_<LANG>_COMPILER_LAUNCHER). Under the runner user's home so actions/cache writes it without
  # root, the same reason the SDK lives there. 5 GB, compressed; a key that pins the NDK, the ABI and
  # the toolchain keeps an incompatible cache from being restored.
  CCACHE_DIR: /home/runner/.ccache
  CCACHE_MAXSIZE: 5G
  CCACHE_COMPRESS: 'true'
  CCACHE_BASEDIR: /home/runner

jobs:
  # Stage 1 -- Preliminary Validation. Every check here reads the repository as text: the workflow
  # file's cache policy and the packaging script's syntax. None needs the JDK, the SDK, the NDK,
  # Gradle, the vendored sources or a build output, so a typo fails here in seconds instead of after
  # the multi-minute native build below. `android-app` needs this job, so a failure blocks the build.
  preflight:
    name: Preliminary validation (static checks, no build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assert the cache policy excludes application outputs
        run: |
          set -euo pipefail
          # A cache may hold only build infrastructure (SDK/NDK, vendored downloads, ccache); never
          # libmain.so, the CMake/Ninja build tree or the APK, so the engine is always linked from the
          # current source. This reads the workflow files themselves, so a future cache step pointed at
          # an output fails here instead of silently shipping a stale binary.
          scripts/build/android/assert-cache-policy.sh .github/workflows/ci-android-app.yml

      - name: Validate the packaging and verification scripts
        run: |
          set -euo pipefail
          bash -n scripts/build/android/package-android.sh
          scripts/build/android/package-android.sh --help >/dev/null
          echo "package-android.sh is syntactically valid and answers --help"
          bash -n scripts/build/android/verify-android-native-libs.sh
          scripts/build/android/verify-android-native-libs.sh --help >/dev/null
          echo "verify-android-native-libs.sh is syntactically valid and answers --help"

  # Stages 2-6: dependency preparation, the pre-compilation Gradle/manifest check, the native and
  # Android build, the post-build tests and the artifact upload.
  android-app:
    name: Android application shell, native dependency packaging and APK inspection
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out the branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare the ephemeral runner
        run: |
          # Only on this disposable hosted runner. The preinstalled Android SDK is removed so the
          # pinned one below is the only SDK in play.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          # cmake and ninja are needed by the native half (build-android.sh builds the real engine
          # here); git/curl/unzip/xz-utils/python3 are what vendor.sh and the FFmpeg cross-build
          # need; ccache is the compiler cache the native build is launcher-wrapped with. The same set
          # ci-android-test.yml uses for the identical build.
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build git curl unzip xz-utils python3 ca-certificates ccache
          sudo apt-get clean
          cmake --version
          ninja --version
          ccache --version | head -n 1
          df -h "$RUNNER_TEMP"

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.8.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Restore the Android SDK and NDK cache
        id: sdk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}
          # The key names both platforms: an SDK cached before android-28 was added would restore
          # without the native build's platform and fail the engine configure.
          key: android-sdk-cmdline${{ env.CMDLINE_TOOLS_VERSION }}-ndk${{ env.NDK_VERSION }}-p${{ env.ANDROID_API }}-n${{ env.NATIVE_API }}

      - name: Install the Android SDK, build-tools, platform and NDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # --retry-all-errors and --http1.1: the 157 MiB cmdline-tools download has been seen to fail
          # at 90%+ with "HTTP/2 stream was not closed cleanly" (curl 92), which plain --retry does not
          # cover.
          curl -fL --http1.1 --retry 5 --retry-all-errors --retry-delay 5 -o /tmp/cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS_VERSION}_latest.zip"
          echo "${CMDLINE_TOOLS_SHA1}  /tmp/cmdline-tools.zip" | sha1sum -c -
          mkdir -p "${ANDROID_SDK_ROOT}/cmdline-tools"
          unzip -q /tmp/cmdline-tools.zip -d "${ANDROID_SDK_ROOT}/cmdline-tools"
          mv "${ANDROID_SDK_ROOT}/cmdline-tools/cmdline-tools" "${ANDROID_SDK_ROOT}/cmdline-tools/latest"
          rm /tmp/cmdline-tools.zip
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          # android-28 is the native engine's platform floor (build-android.sh's --api 28); android-35
          # is what the app packages against. Both are installed so the same SDK serves the native
          # build and Gradle.
          "$SDKMANAGER" --install "ndk;${NDK_VERSION}" "platforms;android-${ANDROID_API}" \
            "platforms;android-${NATIVE_API}" "build-tools;${ANDROID_API}.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4.4.4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          # setup-gradle defaults cache-read-only to true on any branch that is not the repository's
          # default branch (here, main), so on this branch it restored the Gradle User Home but never
          # wrote it back - the previous run's log says "Cache is read-only: will not save state", and
          # every run re-downloaded Gradle 8.12 and every dependency. Turn it off so the Gradle User
          # Home (the dependency caches under ~/.gradle/caches) is saved at the end of a successful job
          # and restored by the next one. It stays an optimization: a miss just downloads as before.
          cache-read-only: false

      - name: Export the Android environment
        run: |
          set -euo pipefail
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          test -d "${ANDROID_SDK_ROOT}/platforms/android-${ANDROID_API}" \
            || { echo "::error::platform android-${ANDROID_API} is missing after install"; exit 1; }
          test -d "${ANDROID_SDK_ROOT}/platforms/android-${NATIVE_API}" \
            || { echo "::error::platform android-${NATIVE_API} (the native build's floor) is missing after install"; exit 1; }
          test -d "${ANDROID_SDK_ROOT}/build-tools/${ANDROID_API}.0.0" \
            || { echo "::error::build-tools ${ANDROID_API}.0.0 is missing after install"; exit 1; }

      - name: Cache the vendored dependency downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/zhr-vendor
          key: android-vendor-v1-${{ hashFiles('GeneralsMD/Code/Tools/vendor.sh', 'GeneralsMD/Code/Libraries/Source/**/*.patch') }}

      - name: Restore the ccache compiler cache
        id: ccache-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          # A unique key per run, with prefix restore-keys (the reference workflow's pattern).
          # Plain actions/cache only saves on a successful job, so a run cancelled or failed inside
          # the long native build (observed) never persisted its compiler output; the matching
          # actions/cache/save step below runs with `if: always()`. The key pins what a cached object
          # depends on - the runner image, NDK, ABI, build type and build script (its flags); the
          # source is deliberately excluded, so editing one file recompiles one translation unit and
          # hits the rest. The run id makes the primary key unique, so the save always writes a new
          # entry and the restore-keys below always find the newest compatible one.
          key: android-ccache-${{ runner.os }}-${{ runner.arch }}-ndk${{ env.NDK_VERSION }}-${{ env.NATIVE_ABI }}-${{ env.NATIVE_BUILD_TYPE }}-${{ hashFiles('scripts/build/android/build-android.sh', 'scripts/build/android/android.toolchain.cmake') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            android-ccache-${{ runner.os }}-${{ runner.arch }}-ndk${{ env.NDK_VERSION }}-${{ env.NATIVE_ABI }}-${{ env.NATIVE_BUILD_TYPE }}-${{ hashFiles('scripts/build/android/build-android.sh', 'scripts/build/android/android.toolchain.cmake') }}-
            android-ccache-${{ runner.os }}-${{ runner.arch }}-ndk${{ env.NDK_VERSION }}-${{ env.NATIVE_ABI }}-${{ env.NATIVE_BUILD_TYPE }}-
            android-ccache-${{ runner.os }}-${{ runner.arch }}-ndk${{ env.NDK_VERSION }}-${{ env.NATIVE_ABI }}-

      - name: Report the restored ccache state
        run: |
          set -euo pipefail
          mkdir -p "${CCACHE_DIR}"
          ccache --set-config=max_size="${CCACHE_MAXSIZE}"
          ccache --set-config=compression=true
          # A cross-compile (host clang, target aarch64-android via the NDK sysroot) confuses
          # ccache's default mtime-based direct mode across checkouts; content hashing keeps hits
          # reliable (the reference workflow sets this for the same reason).
          ccache --set-config=compiler_check=content
          ccache --zero-stats >/dev/null
          echo "ccache version: $(ccache --version | head -n 1)"
          echo "ccache dir:     ${CCACHE_DIR}"
          echo "ccache maxsize: ${CCACHE_MAXSIZE}"
          ccache -s || true

      - name: Fetch the code dependencies (the engine's vendored sources and SDL3's Java glue)
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          # The native engine is built in this job, so the whole vendored source set is needed (SDL3,
          # FFmpeg, FreeType, glslang, ...), not just SDL3's Java glue. --no-art keeps the
          # multi-gigabyte game art out of a job that only needs the code. Same fetch as
          # ci-android-test.yml.
          bash GeneralsMD/Code/Tools/vendor.sh --no-art
          for dep in SDL3/CMakeLists.txt miniaudio/miniaudio.c mbedtls/library/ssl_tls.c \
                     glslang freetype SPIRV-Cross SDL_shadercross GameSpy; do
            test -e "GeneralsMD/Code/Libraries/Source/${dep}" \
              || { echo "::error::vendor.sh did not produce Libraries/Source/${dep}"; exit 1; }
          done
          test -d GeneralsMD/Code/Libraries/Source/SDL3/android-project/app/src/main/java/org/libsdl/app \
            || { echo "::error::vendor.sh did not produce SDL3's Java glue"; exit 1; }
          echo "the vendored sources and SDL3's Java glue are present"

      - name: Assert the Gradle configuration and the packaged manifest
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          ANDROID_DIR="$PWD/android"

          # 1. The Gradle configuration resolves: the debug variant's manifest task runs, which is
          #    where the namespace, applicationId, SDK levels and the manifest merge are all checked
          #    by AGP itself.
          ( cd "$ANDROID_DIR" && gradle --no-daemon :app:processDebugMainManifest )
          MANIFEST="$ANDROID_DIR/app/build/intermediates/merged_manifest/debug/processDebugMainManifest/AndroidManifest.xml"
          [ -f "$MANIFEST" ] || MANIFEST=$(find "$ANDROID_DIR/app/build/intermediates" -name AndroidManifest.xml -path '*merged*' | head -n 1)
          [ -f "$MANIFEST" ] || fail "the merged manifest was not produced"
          echo "--- merged manifest ---"; cat "$MANIFEST"

          # 2. Identity, from the merged manifest AGP actually packages.
          grep -q 'package="io.github.olcayseygan.zerohourreforged"' "$MANIFEST" \
            || fail "the applicationId is not the project's own id"
          if grep -q 'com.generalsx.zerohour' "$MANIFEST"; then
            fail "the reference port's package identity (com.generalsx.zerohour) leaked into the manifest"
          fi
          grep -q 'android:name="io.github.olcayseygan.zerohourreforged.ZeroHourActivity"' "$MANIFEST" \
            || fail "the launcher Activity is not the project's own ZeroHourActivity"

          # 2b. The Phase-3 launcher screen is present; the game Activity is still declared (a
          #     shortcut placed before it still resolves). Which one is the home-screen entry point
          #     is asserted from the packaged APK's badging below.
          grep -q 'android:name="io.github.olcayseygan.zerohourreforged.SetupActivity"' "$MANIFEST" \
            || fail "the setup Activity (the folder picker screen) is not declared"
          if grep -q 'android.intent.category.LAUNCHER' "$MANIFEST" ; then
            : # present; its owner is checked on the APK below
          else
            fail "no LAUNCHER entry point is declared"
          fi

          # 2c. The in-app System Requirements & Device Compatibility screen is declared and is not
          #     exported (it is reached only from the setup screen).
          grep -q 'android:name="io.github.olcayseygan.zerohourreforged.CompatibilityActivity"' "$MANIFEST" \
            || fail "the compatibility screen (CompatibilityActivity) is not declared"
          grep -A8 'android:name="io.github.olcayseygan.zerohourreforged.CompatibilityActivity"' "$MANIFEST" \
            | grep -q 'android:exported="false"' \
            || fail "CompatibilityActivity must not be exported"

          # 3. Orientation and the configChanges set SDL3 3.4.16's android-project declares.
          grep -q 'android:screenOrientation="landscape"' "$MANIFEST" \
            || fail "the Activity is not landscape"
          grep -q 'android:configChanges=' "$MANIFEST" || fail "the Activity declares no configChanges"
          for c in orientation screenSize screenLayout keyboard keyboardHidden uiMode; do
            grep -q "$c" "$MANIFEST" || fail "configChanges is missing $c"
          done

          # 4. Permissions: only the two the native code uses; no storage permission.
          grep -q 'android.permission.CHANGE_WIFI_MULTICAST_STATE' "$MANIFEST" \
            || fail "the multicast-lock permission the LAN lobby needs is not declared"
          grep -q 'android.permission.INTERNET' "$MANIFEST" \
            || fail "the INTERNET permission the LAN lobby's UDP sockets need is not declared"
          for p in MANAGE_EXTERNAL_STORAGE READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE \
                   ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION; do
            if grep -q "android.permission.$p" "$MANIFEST"; then
              fail "an unnecessary permission ($p) was introduced"
            fi
          done
          perms=$(grep -c 'uses-permission' "$MANIFEST" || true)
          [ "$perms" -le 2 ] || fail "$perms permissions declared; only the two justified ones are allowed"

          echo "the Gradle configuration and the packaged manifest are consistent"

      - name: Build the native engine as libmain.so for arm64-v8a
        run: |
          set -euo pipefail
          # The real engine, built by the same script the desktop and native CI use. The app
          # workflow builds it here (rather than downloading one) because no compatible native
          # output exists to reuse: ci-android-test.yml publishes only logs and does not trigger on
          # this branch. Building it here is what makes the APK contain the real engine, with its
          # real runtime dependency set, instead of a stand-in.
          #
          # The build tree is not cached, but remove any stale engine first so "libmain.so exists"
          # can never be satisfied by a file from an earlier step or run: the link below must produce
          # it from the current source.
          rm -f "$NATIVE_BUILD/libmain.so"
          started=$(date +%s)
          scripts/build/android/build-android.sh --config Release \
            --build-dir "$NATIVE_BUILD" --target generals
          test -f "$NATIVE_BUILD/libmain.so" \
            || { echo "::error::the engine did not produce $NATIVE_BUILD/libmain.so"; exit 1; }
          # Prove the engine was linked afresh this run, not restored from a cache: the file must be
          # newer than the build step's own start. ccache reuses object files (correctly - a content
          # match), but the final link always runs, so the artifact is always current source.
          linked=$(stat -c %Y "$NATIVE_BUILD/libmain.so")
          [ "$linked" -ge "$started" ] \
            || { echo "::error::$NATIVE_BUILD/libmain.so predates this build step: it was not linked from the current source"; exit 1; }
          echo "libmain.so linked this run at $(date -d "@$linked" -u '+%Y-%m-%dT%H:%M:%SZ')"
          ls -la "$NATIVE_BUILD/libmain.so"
          # SDL3 is a standalone shared library on Android (SDL_SHARED on, SDL_STATIC off), so the
          # same link must have produced it beside the engine. Without it libmain.so cannot start.
          test -f "$NATIVE_BUILD/libSDL3.so" \
            || { echo "::error::the build did not produce $NATIVE_BUILD/libSDL3.so: SDL3 was not built shared"; exit 1; }
          ls -la "$NATIVE_BUILD/libSDL3.so"

      - name: Print the ccache statistics
        run: |
          set -euo pipefail
          # The compiler cache this build is launcher-wrapped with: the hit rate is the evidence that
          # the restored cache was actually used. On a first run the rate is ~0 (everything compiles
          # and is stored); on a later run with unchanged sources it approaches 100%.
          ccache -s -v
          # Read the summary counters (a missing counter coerces to 0). The hit rate is the number the
          # report cites: ~0% on a cold cache, near 100% on a warm one with unchanged sources.
          read -r hits misses < <(ccache -s | awk '/^[[:space:]]*Hits:/ {h=$2} /^[[:space:]]*Misses:/ {m=$2} END {print h+0, m+0}')
          total=$(( hits + misses ))
          if [ "$total" -gt 0 ]; then
            echo "ccache hit rate: $hits / $total ($(( 100 * hits / total ))%)"
          else
            echo "ccache reported no cacheable compiles this run"
          fi

      - name: Audit the native dependencies from the ELF (Phase 4)
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          LIB="$NATIVE_BUILD/libmain.so"
          [ -f "$LIB" ] || fail "libmain.so was not built"

          # The NDK's own LLVM tools, the same ones the native workflow uses. The prebuilt host
          # directory is the only one under toolchains/llvm/prebuilt on this runner.
          BIN="$(ls -d "${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"/toolchains/llvm/prebuilt/*/bin | head -n 1)"
          READELF="$BIN/llvm-readelf"
          NM="$BIN/llvm-nm"
          [ -x "$READELF" ] || fail "llvm-readelf is missing: $READELF"
          [ -x "$NM" ] || fail "llvm-nm is missing: $NM"

          # readelf output is captured into variables and grepped from there, never piped into
          # `grep -q`: under `set -o pipefail` a `readelf ... | grep -q` on a multi-megabyte symbol
          # table dies with SIGPIPE and reports a symbol that IS present as missing.

          echo "===== ELF header ====="
          header=$("$READELF" -h "$LIB"); echo "$header"
          grep -q 'Class: *ELF64' <<<"$header" || fail "libmain.so is not ELF64"
          grep -q 'Machine: *AArch64' <<<"$header" || fail "libmain.so is not AArch64"
          grep -qE 'Type: *DYN' <<<"$header" || fail "libmain.so is not a shared object (DYN)"

          echo "===== SONAME and DT_NEEDED ====="
          dynamic=$("$READELF" -d "$LIB"); grep -E 'SONAME|NEEDED' <<<"$dynamic"
          grep -q 'libmain\.so' <<<"$dynamic" || fail "libmain.so has no SONAME (libmain.so)"
          grep -q 'Library soname: \[libmain\.so\]' <<<"$dynamic" \
            || fail "libmain.so's SONAME is not libmain.so"

          # The exported entry point SDL3's SDLActivity dlsym()s.
          echo "===== exported SDL_main ====="
          dynsyms=$("$READELF" --dyn-syms "$LIB")
          grep -qE '[[:space:]]SDL_main$' <<<"$dynsyms" \
            || fail "libmain.so does not export SDL_main (SDLActivity cannot start the game)"

          # ---- dependency classification (the Phase-4 deliverable) ----
          # Every DT_NEEDED is placed in exactly one class. System libraries are provided by the
          # device through the NDK's stable ABI and must NOT be packaged; anything else must be a
          # real file inside the APK. A desktop library in either set is a port defect.
          needed=$(sed -n 's/.*Shared library: \[\(.*\)\]/\1/p' <<<"$dynamic")
          echo "--- DT_NEEDED, classified ---"
          system=()
          packaged=()
          for lib in $needed; do
            case "$lib" in
              libc.so|libm.so|libdl.so|liblog.so|libandroid.so|libz.so|libGLESv1_CM.so|libGLESv2.so|\
              libGLESv3.so|libEGL.so|libvulkan.so|libOpenSLES.so|libaaudio.so|libmediandk.so|\
              libcamera2ndk.so|libjnigraphics.so|libnativewindow.so|libsync.so)
                system+=("$lib"); echo "  system-provided : $lib" ;;
              libc++_shared.so|libSDL3.so)
                packaged+=("$lib"); echo "  packaged in APK : $lib" ;;
              *)
                fail "libmain.so needs '$lib', which is neither a known Android system library nor one this port packages. Classify it before shipping." ;;
            esac
          done
          for lib in libSDL3.so libc++_shared.so; do
            printf '%s\n' "${packaged[@]:-}" | grep -qx "$lib" \
              || fail "libmain.so does not depend on $lib, which the APK must carry"
          done

          # No desktop-Linux or Windows library may have reached the shared object.
          for token in libX11 libfontconfig libwayland libxkbcommon libGL.so libdxvk libcurl; do
            if grep -q -- "$token" <<<"$dynamic"; then
              fail "a desktop-only library ($token) reached libmain.so's DT_NEEDED"
            fi
          done

          # SDL3 is a standalone shared library, so libmain.so imports SDL_* and names libSDL3.so
          # (classified above). What libmain.so must NOT contain is an SDL3 implementation of its
          # own: that would be a second copy of SDL3, and the two would disagree about state. The
          # one SDL_ symbol it defines is the app's own entry point, SDL_main.
          undef_sdl=$("$NM" --undefined-only "$LIB" | grep -cE '(^| )U +SDL_' || true)
          echo "SDL_ symbols imported from libSDL3.so: ${undef_sdl}"
          [ "${undef_sdl:-0}" -gt 0 ] \
            || fail "libmain.so imports no SDL_ symbol: SDL3 is not linked into the engine"
          defined_sdl=$("$NM" --dynamic --defined-only "$LIB" | grep -E '[[:space:]]SDL_' | grep -vE '[[:space:]]SDL_main$' || true)
          if [ -n "$defined_sdl" ]; then
            echo "$defined_sdl"
            fail "libmain.so defines SDL_ symbols of its own: a second SDL3 implementation is inside the engine (only SDL_main may be defined there)"
          fi
          echo "libmain.so defines no SDL3 symbol but its own SDL_main: one SDL3 implementation, in libSDL3.so"

          # libSDL3.so is the other half of the pair: it must be the AArch64 SDL3 the engine linked,
          # with the SONAME libmain.so names, SDL3's JNI entry point (SDLActivity's native methods
          # are registered by it) and the SDL_* the engine imports.
          SDL3_LIB="$NATIVE_BUILD/libSDL3.so"
          [ -f "$SDL3_LIB" ] || fail "the build produced no libSDL3.so: SDL3 was not built shared"
          echo "===== libSDL3.so ====="
          sdl3_header=$("$READELF" -h "$SDL3_LIB"); grep -E 'Class:|Machine:|Type:' <<<"$sdl3_header"
          grep -q 'Class: *ELF64' <<<"$sdl3_header" || fail "libSDL3.so is not ELF64"
          grep -q 'Machine: *AArch64' <<<"$sdl3_header" || fail "libSDL3.so is not AArch64"
          grep -qE 'Type: *DYN' <<<"$sdl3_header" || fail "libSDL3.so is not a shared object"
          sdl3_dynamic=$("$READELF" -d "$SDL3_LIB"); grep -E 'SONAME|NEEDED' <<<"$sdl3_dynamic"
          grep -q 'Library soname: \[libSDL3\.so\]' <<<"$sdl3_dynamic" \
            || fail "libSDL3.so's SONAME is not libSDL3.so (libmain.so names it in DT_NEEDED)"
          sdl3_dynsyms=$("$READELF" --dyn-syms "$SDL3_LIB")
          for sym in JNI_OnLoad SDL_Init SDL_CreateGPUDevice SDL_GetAndroidInternalStoragePath; do
            grep -qE "[[:space:]]${sym}\$" <<<"$sdl3_dynsyms" \
              || fail "libSDL3.so does not export ${sym}"
          done
          echo "libSDL3.so exports JNI_OnLoad and the SDL_* entry points the engine uses"
          # SDL3 is C and needs nothing but bionic and the NDK's system libraries.
          for lib in $(sed -n 's/.*Shared library: \[\(.*\)\]/\1/p' <<<"$sdl3_dynamic"); do
            case "$lib" in
              libc.so|libm.so|libdl.so|liblog.so|libandroid.so|libz.so|libGLESv1_CM.so|libGLESv2.so|\
              libGLESv3.so|libEGL.so|libvulkan.so|libOpenSLES.so|libaaudio.so|libmediandk.so|\
              libcamera2ndk.so|libjnigraphics.so|libnativewindow.so|libsync.so)
                continue ;;
            esac
            fail "libSDL3.so needs '$lib', which is neither an Android system library nor packaged in the APK"
          done
          echo "libSDL3.so needs Android system libraries only"

          # The Android API the object was built for: the build's own configure record is the
          # authoritative floor; the NDK normally also stamps an Android ident note into the ELF, so
          # report it (a warning if absent - the CMakeCache check below is what fails the build).
          echo "===== Android API compatibility ====="
          grep -E '^ANDROID_PLATFORM:[^=]*=' "$NATIVE_BUILD/CMakeCache.txt" \
            || fail "the native build's CMakeCache has no ANDROID_PLATFORM"
          grep -qE "^ANDROID_PLATFORM:[^=]*=android-${NATIVE_API}$" "$NATIVE_BUILD/CMakeCache.txt" \
            || fail "the engine was not built for android-${NATIVE_API}"
          notes=$("$READELF" -n "$LIB")
          if grep -qi 'android' <<<"$notes"; then
            echo "--- Android ident note ---"; grep -i -A2 'android' <<<"$notes"
          else
            echo "::warning::libmain.so carries no Android ident note; the ANDROID_PLATFORM record above is the API floor"
          fi
          echo "libmain.so is stamped for android-${NATIVE_API} (the configure record)"

          # Unresolved dynamic symbols: every UND entry must be satisfied by the DT_NEEDED set
          # (a system library or the packaged libc++_shared.so). Print the count and the classes of
          # what remains undefined so the log records the loader's work; a symbol from neither set
          # would already have failed the DT_NEEDED classification above.
          undef=$("$READELF" --dyn-syms "$LIB" | grep -c 'UND' || true)
          echo "undefined dynamic symbols the loader resolves from DT_NEEDED: ${undef}"

          echo "libmain.so: ELF64 AArch64 DYN, SONAME libmain.so, exports SDL_main, imports SDL_* from libSDL3.so,"
          echo "            DT_NEEDED = system libs + libSDL3.so + libc++_shared.so (the packaged dependencies)"
          echo "libSDL3.so: ELF64 AArch64 DYN, SONAME libSDL3.so, exports JNI_OnLoad and SDL_*, system libs only"

      - name: Package the APK (stage the engine, SDL3 and the C++ runtime, then run Gradle)
        run: |
          set -euo pipefail
          # package-android.sh stages libmain.so, libSDL3.so and the NDK's libc++_shared.so into
          # android/app/src/main/jniLibs/arm64-v8a (and SDL3's Java glue into java-sdl/), then runs
          # Gradle. Both staged directories are gitignored and re-staged every run.
          scripts/build/android/package-android.sh --build-dir "$NATIVE_BUILD"
          APK="$PWD/android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK" || { echo "::error::the packaging script produced no APK"; exit 1; }
          ls -la "$APK"

      - name: Run the pure-Java unit tests
        run: |
          set -euo pipefail
          # The folder validator, the staging plan and the device-compatibility rule are pure Java (no
          # Android types), so they run as JVM unit tests: the engine's own install-folder rule
          # (INIZH.big + the base game's Textures.big), the incremental copy plan (copy once, then only
          # what changed), and CompatibilityEvaluator's verdict from DeviceCapabilities.
          ( cd android && gradle --no-daemon :app:testDebugUnitTest )
          report=$(find android/app/build/test-results -name 'TEST-*.xml' | head -n 1)
          [ -n "$report" ] || { echo "::error::no JUnit report was produced"; exit 1; }
          echo "--- unit test results ---"
          grep -h -o 'testsuite name="[^"]*" tests="[0-9]*"[^>]*' $(find android/app/build/test-results -name 'TEST-*.xml') || true
          failures=$(grep -h -o 'failures="[0-9]*"' $(find android/app/build/test-results -name 'TEST-*.xml') | grep -o '[0-9]*' | paste -sd+ | bc)
          [ "${failures:-0}" = "0" ] || { echo "::error::$failures unit test failures"; exit 1; }
          echo "the pure-Java unit tests passed"

      - name: Inspect the packaged APK (structure, dependencies, ABI, manifest)
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          ANDROID_DIR="$PWD/android"
          APK="$ANDROID_DIR/app/build/outputs/apk/debug/app-debug.apk"
          [ -f "$APK" ] || fail "the packaging step produced no APK"
          echo "--- APK ---"; ls -la "$APK"

          # 0. Archive integrity: a corrupt zip is not a shippable APK.
          unzip -tq "$APK" >/dev/null || fail "the APK is not a valid zip archive"

          # 1. Expected native libraries at the expected paths, for arm64-v8a only.
          entries=$(unzip -Z1 "$APK")
          for lib in libmain.so libSDL3.so libc++_shared.so; do
            grep -q "^lib/arm64-v8a/${lib//./\\.}\$" <<<"$entries" \
              || fail "the APK does not carry lib/arm64-v8a/$lib"
          done
          others=$(grep -E '^lib/(armeabi|armeabi-v7a|x86|x86_64)/' <<<"$entries" || true)
          [ -z "$others" ] || fail "the APK carries an ABI other than arm64-v8a: $others"
          # The staged set is exactly three libraries: nothing else may be under lib/ (directory
          # entries, which end in '/', are not libraries).
          extra_libs=$(grep -E '^lib/' <<<"$entries" | grep -vE '/$' \
            | grep -vE '^lib/arm64-v8a/(libmain|libSDL3|libc\+\+_shared)\.so$' || true)
          [ -z "$extra_libs" ] || fail "the APK carries unexpected native libraries: $extra_libs"
          # SDL3 is a standalone shared library: exactly one libSDL3.so, at the arm64 path above.
          sdl3_count=$(grep -cE '^lib/.*/libSDL3.*\.so$' <<<"$entries" || true)
          [ "${sdl3_count:-0}" -eq 1 ] \
            || fail "the APK carries ${sdl3_count:-0} SDL3 shared objects; the engine links exactly one (libSDL3.so)"

          # 2. No duplicate native library anywhere in the archive (same basename twice), and no
          #    library staged in more than one ABI directory.
          dupes=$(grep -E '\.so$' <<<"$entries" | xargs -n1 basename | sort | uniq -d || true)
          [ -z "$dupes" ] || fail "the APK carries duplicate native libraries: $dupes"

          # 3. No proprietary game data: the player supplies their own .big archives. The APK must
          #    carry none of the engine's game-data extensions or folders.
          game_data=$(grep -iE '\.(big|bik|w3d|w3x|tga|dds|rep)$|(^|/)Data/' <<<"$entries" || true)
          [ -z "$game_data" ] || fail "the APK carries game data (the player must supply their own): $game_data"
          # There is no assets/ directory at all: game data is never bundled.
          if grep -qE '^assets/' <<<"$entries"; then
            fail "the APK carries an assets/ directory: $(grep -E '^assets/' <<<"$entries" | head -n 5)"
          fi

          # 4. The packaged libmain.so is the real engine: an AArch64 shared object, and its
          #    DT_NEEDED set is satisfied by the APK's own contents plus Android system libraries
          #    (the reference port's cross-check, adapted to this port's libSDL3.so + c++_shared).
          unzip -o -q "$APK" 'lib/arm64-v8a/*' -d "$RUNNER_TEMP/apk-lib"
          BIN="$(ls -d "${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"/toolchains/llvm/prebuilt/*/bin | head -n 1)"
          readelf="$BIN/llvm-readelf"
          [ -x "$readelf" ] || fail "llvm-readelf is missing: $readelf"
          header=$("$readelf" -h "$RUNNER_TEMP/apk-lib/lib/arm64-v8a/libmain.so")
          grep -q 'Class: *ELF64' <<<"$header" || fail "the packaged libmain.so is not ELF64"
          grep -q 'Machine: *AArch64' <<<"$header" || fail "the packaged libmain.so is not AArch64"
          grep -qE 'Type: *DYN' <<<"$header" || fail "the packaged libmain.so is not a shared object"
          dynsyms=$("$readelf" --dyn-syms "$RUNNER_TEMP/apk-lib/lib/arm64-v8a/libmain.so")
          grep -qE '[[:space:]]SDL_main$' <<<"$dynsyms" || fail "the packaged libmain.so does not export SDL_main"

          # The packaged SDL3 is the library the engine was linked against: same SONAME that
          # libmain.so's DT_NEEDED names, and the JNI entry point SDLActivity needs. AGP strips
          # symbols from the dynamic symbol table's local half only, so these stay visible.
          sdl3_apk="$RUNNER_TEMP/apk-lib/lib/arm64-v8a/libSDL3.so"
          sdl3_dynamic=$("$readelf" -d "$sdl3_apk")
          grep -q 'Library soname: \[libSDL3\.so\]' <<<"$sdl3_dynamic" \
            || fail "the packaged libSDL3.so's SONAME is not libSDL3.so"
          sdl3_dynsyms=$("$readelf" --dyn-syms "$sdl3_apk")
          grep -qE '[[:space:]]JNI_OnLoad$' <<<"$sdl3_dynsyms" \
            || fail "the packaged libSDL3.so does not export JNI_OnLoad"
          echo "the packaged libSDL3.so is an AArch64 shared object, SONAME libSDL3.so, exporting JNI_OnLoad"

          # The packaged engine is the one just built and audited: compare the dynamic dependency
          # set, which AGP's symbol stripping does not touch (a stand-in stub would not link
          # libc++_shared.so, so this also proves the real engine is what was packaged).
          built_needed=$(sed -n 's/.*Shared library: \[\(.*\)\]/\1/p' <<<"$("$readelf" -d "$NATIVE_BUILD/libmain.so")" | sort)
          apk_needed=$(sed -n 's/.*Shared library: \[\(.*\)\]/\1/p' <<<"$("$readelf" -d "$RUNNER_TEMP/apk-lib/lib/arm64-v8a/libmain.so")" | sort)
          [ "$built_needed" = "$apk_needed" ] \
            || fail "the packaged libmain.so's dependencies differ from the engine that was built"
          grep -q 'libc++_shared.so' <<<"$apk_needed" \
            || fail "the packaged libmain.so does not link libc++_shared.so: it is not the real engine"
          echo "the packaged libmain.so is the built engine (identical dependency set)"

          # Every non-system DT_NEEDED must be a real file inside the APK.
          dynamic=$("$readelf" -d "$RUNNER_TEMP/apk-lib/lib/arm64-v8a/libmain.so")
          echo "--- packaged libmain.so DT_NEEDED ---"; grep -E 'SONAME|NEEDED' <<<"$dynamic"
          missing=0
          for lib in $(sed -n 's/.*Shared library: \[\(.*\)\]/\1/p' <<<"$dynamic"); do
            case "$lib" in
              libc.so|libm.so|libdl.so|liblog.so|libandroid.so|libz.so|libGLESv1_CM.so|libGLESv2.so|\
              libGLESv3.so|libEGL.so|libvulkan.so|libOpenSLES.so|libaaudio.so|libmediandk.so|\
              libcamera2ndk.so|libjnigraphics.so|libnativewindow.so|libsync.so)
                continue ;;  # an Android system library the device provides via the NDK stable ABI
            esac
            if [ ! -f "$RUNNER_TEMP/apk-lib/lib/arm64-v8a/$lib" ]; then
              echo "::error::libmain.so needs '$lib' at runtime but it is not packaged in the APK"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || fail "the APK is missing a required native library; it would fail to load on a device"
          echo "every non-system DT_NEEDED of libmain.so is present in the APK"

          # 5. Manifest metadata and ABI targeting, from the packaged manifest itself.
          aapt2=$(find "$ANDROID_SDK_ROOT/build-tools" -name aapt2 | head -n 1)
          [ -n "$aapt2" ] || fail "aapt2 is not present in build-tools"
          badging=$("$aapt2" dump badging "$APK")
          echo "--- APK badging ---"; echo "$badging"
          launchable=$(sed -n "s/^launchable-activity: name='\([^']*\)'.*/\1/p" <<<"$badging")
          [ "$launchable" = "io.github.olcayseygan.zerohourreforged.SetupActivity" ] \
            || fail "the home-screen entry point is '$launchable', not the setup screen"
          grep -q "package: name='io.github.olcayseygan.zerohourreforged'" <<<"$badging" \
            || fail "the packaged applicationId is not the project's own id"
          grep -q "native-code: 'arm64-v8a'" <<<"$badging" \
            || fail "the packaged native-code ABI is not arm64-v8a alone"
          # aapt2's badging line is spelled "sdkVersion:" in some build-tools releases and
          # "minSdkVersion:" in others, so match the suffix case-insensitively.
          grep -qiE "sdkVersion:'28'" <<<"$badging" \
            || fail "the packaged minSdkVersion is not 28 (the native engine's floor)"
          grep -q "targetSdkVersion:'35'" <<<"$badging" \
            || fail "the packaged targetSdkVersion is not 35"
          # No storage permission in the packaged APK, as in the merged manifest.
          for p in MANAGE_EXTERNAL_STORAGE READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE; do
            if grep -q "uses-permission: name='android.permission.$p'" <<<"$badging"; then
              fail "the packaged APK requests $p"
            fi
          done

          echo "the APK: valid archive; libmain.so + libSDL3.so + libc++_shared.so for arm64-v8a only, no duplicates,"
          echo "        no game data, every DT_NEEDED satisfied, SetupActivity the launcher, minSdk 28/target 35"

      - name: Verify the native payload with the static verifier (Phase 2)
        run: |
          set -euo pipefail
          # The same verifier package-android.sh runs at staging time and again after packaging, run
          # here directly so the CI log carries the verdict independently of the script's own flow.
          # It rejects: a missing or unused library, a non-ELF64/non-AArch64/x86 object, a wrong
          # SONAME, a DT_NEEDED that is neither a system library nor packaged, a missing export
          # (SDL_main, JNI_OnLoad, the SDL3 entry points), a second SDL3, and an APK library that is
          # not the staged object (build id) - i.e. a stale one.
          VERIFY=scripts/build/android/verify-android-native-libs.sh
          STAGED=android/app/src/main/jniLibs/arm64-v8a
          APK="$PWD/android/app/build/outputs/apk/debug/app-debug.apk"
          [ -f "$APK" ] || { echo "::error::the APK is missing"; exit 1; }
          rm -rf "$RUNNER_TEMP/apk-native-verify"
          mkdir -p "$RUNNER_TEMP/apk-native-verify"
          unzip -o -q "$APK" 'lib/*' -d "$RUNNER_TEMP/apk-native-verify"

          "$VERIFY" --libs "$STAGED" --ndk "$ANDROID_NDK_HOME" --glue android/app/src/main/java-sdl
          "$VERIFY" --libs "$RUNNER_TEMP/apk-native-verify/lib/arm64-v8a" --ndk "$ANDROID_NDK_HOME" \
            --reference "$STAGED"

      - name: Upload the APK, the engine and the diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-app-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/logs/
            build-android-arm64/android-configure.log
            build-android-arm64/android-build.log
          if-no-files-found: warn
          retention-days: 7

      # Saved with `if: always()` and under the run's unique key, so a run that is cancelled or fails
      # inside the long native build still keeps the objects it did compile - the whole point of the
      # explicit restore/save pair. Plain actions/cache's automatic post-step save only fires on a
      # successful job and would drop them. A save with nothing to write (a cold run cancelled before
      # the first compile) is harmless: the cache simply does not grow.
      - name: Save the ccache compiler cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: android-ccache-${{ runner.os }}-${{ runner.arch }}-ndk${{ env.NDK_VERSION }}-${{ env.NATIVE_ABI }}-${{ env.NATIVE_BUILD_TYPE }}-${{ hashFiles('scripts/build/android/build-android.sh', 'scripts/build/android/android.toolchain.cmake') }}-${{ github.run_id }}-${{ github.run_attempt }}
