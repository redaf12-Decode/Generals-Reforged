# Project-wide Gradle settings.
#
# The engine's libmain.so and SDL3's Java glue are staged into app/src/main/{jniLibs,java-sdl}
# by scripts/build/android/package-android.sh and are gitignored; nothing here is committed
# from them.
org.gradle.jvmargs=-Xmx2048m

# AGP 8 defaults; stated so a stale machine-wide gradle.properties cannot change them.
android.nonTransitiveRClass=true

# Jetpack Compose and every AndroidX artifact it pulls require the AndroidX dependency mapping.
# There is no legacy support-library dependency in this project, so Jetifier stays off.
android.useAndroidX=true
