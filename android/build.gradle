// The Android Gradle Plugin version is the one SDL3 3.4.16 ships in its own
// android-project (android-project/build.gradle), so the shell is built with the
// same toolchain SDL3's Java glue is written against. Gradle 8.12 is that
// project's wrapper version and is the version CI sets up.
//
// Kotlin 2.2.0 is the first release whose Gradle plugin officially supports AGP
// 8.7.3: the 2.1.20-2.1.21 range stops at AGP 8.7.2 (both ranges already cover
// the Gradle 8.12 CI pins). The Compose compiler is no longer a separate
// artifact - from Kotlin 2.0 it ships as the `kotlin.plugin.compose` Gradle
// plugin and must carry the same version as the Kotlin plugin.
plugins {
    id 'com.android.application' version '8.7.3' apply false
    id 'org.jetbrains.kotlin.android' version '2.2.0' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.2.0' apply false
}
