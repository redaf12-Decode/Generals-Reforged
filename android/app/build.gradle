// The Android application module for Zero Hour Reforged.
//
// It compiles only the Java shell and packages the APK. The native engine is
// cross-compiled outside Gradle (scripts/build/android/build-android.sh) and
// staged into src/main/jniLibs by scripts/build/android/package-android.sh,
// together with SDL3's Java glue in src/main/java-sdl. Both staged directories
// are gitignored.
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    // A new identity derived from this project's own published id
    // (io.github.olcayseygan.ZeroHourReforged, its Flatpak app id and macOS
    // bundle id). NOT the reference port's com.generalsx.zerohour.
    namespace 'io.github.olcayseygan.zerohourreforged'
    compileSdk 35

    // The NDK the engine is cross-compiled with (scripts/build/android/build-android.sh and the CI
    // workflows pin the same revision). Gradle does not compile native code here, but it does use the
    // NDK's strip on the staged libraries; naming the revision keeps that deterministic instead of
    // falling back to whatever AGP's default happens to be.
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'io.github.olcayseygan.zerohourreforged'

        // The native engine is built against android-28 (the NDK API level in
        // scripts/build/android/android.toolchain.cmake), so the APK must not
        // declare a lower floor: a device below it would install and then fail
        // to load libmain.so.
        minSdk 28

        // SDL3 3.4.16's own android-project targets 35 and is what the staged
        // Java glue is written against.
        targetSdk 35

        // The engine's own version (GeneralsMD/Code/CMakeLists.txt writes
        // VERSION_STRING "v4.0.0"), in the same major*10000+minor*100+patch
        // scheme the version name sorts by.
        versionCode 40000
        versionName '4.0.0'

        // The only ABI the port builds (android.toolchain.cmake, arm64-v8a).
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    sourceSets {
        main {
            // Staged by scripts/build/android/package-android.sh: java-sdl holds
            // org/libsdl/app/*.java from the vendored SDL3 3.4.16 tree, so the
            // Java glue always matches the SDL3 the engine linked; jniLibs holds
            // libmain.so, libSDL3.so and libc++_shared.so.
            java.srcDirs += 'src/main/java-sdl'
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    buildTypes {
        debug {
            // Default: AGP's per-machine debug keystore. No key is committed.
        }
        release {
            minifyEnabled false
        }
    }

    buildFeatures {
        // Enables the Compose compiler for this module; the compiler itself is applied by the
        // org.jetbrains.kotlin.plugin.compose plugin above (Kotlin 2.x has no separate
        // composeOptions block).
        compose = true
    }

    packaging {
        jniLibs {
            // androidx.graphics:graphics-path (a runtime dependency of Compose's ui-graphics) ships
            // libandroidx.graphics.path.so, a JNI library that PathIteratorImpl's static initializer
            // loads with System.loadLibrary - no fallback, so a call into it throws
            // UnsatisfiedLinkError when the library is absent.
            //
            // It is excluded because the APK must carry exactly the engine's three libraries
            // (libmain.so, libSDL3.so, libc++_shared.so) - CI asserts nothing else is under lib/.
            // The library is reached only through Compose's Path.iterator(); this app iterates no
            // Path, and the one artifact that can reach it (animation-core's PathEasing) is never
            // instantiated here. Any future screen that iterates a Path, or uses PathEasing, must
            // remove this exclusion and relax that CI assertion.
            excludes.add '**/libandroidx.graphics.path.so'
        }
    }

    // The Kotlin jvmTarget below is 17; the Kotlin Gradle plugin fails the build when the Java
    // compile target disagrees, so both halves target the JDK 17 CI installs.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        // The staged SDL3 Java glue is upstream code this project does not own;
        // a lint finding in it is not this project's to fix. Its own manifest
        // and Activity are still linted.
        abortOnError false
    }
}

// The native payload is staged outside Gradle (scripts/build/android/package-android.sh): libmain.so
// and libSDL3.so from the native build tree, libc++_shared.so from the NDK. Gradle is the last place
// that can notice the payload is absent - without this, `gradle assembleDebug` on an unstaged tree
// produces an APK with no native libraries that installs and then dies at System.loadLibrary.
def requiredNativeLibs = ['libmain.so', 'libSDL3.so', 'libc++_shared.so']
def nativeLibsDir = file('src/main/jniLibs/arm64-v8a')

tasks.register('verifyNativeLibraries') {
    description = 'Fails when a native library the APK must carry is missing from jniLibs.'
    doLast {
        def missing = requiredNativeLibs.findAll { !new File(nativeLibsDir, it).isFile() }
        if (!missing.isEmpty()) {
            throw new GradleException(
                "jniLibs/arm64-v8a is missing ${missing.join(', ')}. Stage the payload with " +
                "scripts/build/android/package-android.sh before packaging (it also runs the ELF " +
                "verification this task cannot do).")
        }
    }
}

// Wired to the task that consumes jniLibs, not to preBuild: the manifest and unit-test tasks run
// before the payload is staged in CI and must not require it.
tasks.matching { it.name == 'mergeDebugNativeLibs' || it.name == 'mergeReleaseNativeLibs' }
    .configureEach { dependsOn 'verifyNativeLibraries' }

// Both halves of the shell are compiled for the JDK 17 CI sets up, so the Java and Kotlin
// bytecode targets agree. Nothing here needs desugaring above minSdk 28.
//
// `jvmTarget` is a Property<JvmTarget>, so it is set through the setter rather than assigned a
// String: Groovy's property assignment would try to coerce the String and bypass the enum.
kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    // Jetpack Compose, pinned by the BOM so every Compose artifact resolves to one tested set
    // (material3 1.3.2, ui/foundation/runtime 1.8.3). The Compose compiler itself comes from the
    // org.jetbrains.kotlin.plugin.compose plugin, not from a dependency.
    implementation platform('androidx.compose:compose-bom:2025.06.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    // Activity hosts the Compose tree: ComponentActivity plus setContent, which is what lets the
    // existing Java Activities keep their own logic and hand only their content view to Compose.
    implementation 'androidx.activity:activity-compose:1.10.1'

    // Compose's own tooling, debug-only: the @Preview annotation and the layout inspector support
    // are not part of the shipped app.
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // The only test dependency: the host-side unit tests for the folder validator and the staging
    // plan (GameFolderValidatorTest, GameDataStagingTest). Both are pure Java with no Android types,
    // so they run as JVM unit tests on CI's `:app:testDebugUnitTest`.
    testImplementation 'junit:junit:4.13.2'
}
